version: '3.8'

services:
  gmvn-matrix:
    build: .
    container_name: gmvn-matrix-app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen("http://localhost:8000/").read()'"]
      interval: 30s
      timeout: 5s
      retries: 3
